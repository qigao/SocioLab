  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f6170" x="63.18" y="51.48" transform="rotate(-0 63.18 51.48)">Primary 10-hour windows · ≥1 recorded bin per pair · each source initialized at the window start</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f6170" x="63.18" y="414.18" transform="rotate(-0 63.18 414.18)">Lines connect predeclared reporting deadlines; they do not locate exact times of intervening changes. Arrival uses bin-endpoint labels.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f6170" x="63.18" y="428.22" transform="rotate(-0 63.18 428.22)">No actual delivery, device uptime, attendance, retention or continuous transfer latency is established by these curves.</text>
  </g>
