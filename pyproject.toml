[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qigao-sociolab"
version = "0.1.0"
description = "Python-first social network research using upstream implementations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "networkx==3.7",
  "ndlib==6.0.1",
]

[project.scripts]
sociolab = "sociolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
