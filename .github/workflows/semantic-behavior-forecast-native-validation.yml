name: Semantic behavior forecast native validation

on:
  pull_request:
    branches:
      - feat/semantic-longitudinal-panel
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    name: Linux x64 / independent semantic behavior forecasts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare native runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-results
          python -m pip install networkx==3.7 pandas==2.2.3 'numpy>=2.1,<3'
          python -m pip freeze > validation-results/runtime.txt
      - name: Run semantic and current-journal regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_language_context.py -v 2>&1 | tee validation-results/context.log
          python -m unittest discover -s tests -p test_disagreement_study.py -v 2>&1 | tee validation-results/study.log
          python -m unittest discover -s tests -p test_semantic_llm.py -v 2>&1 | tee validation-results/llm-contract.log
          python -m unittest discover -s tests -p test_semantic_actions.py -v 2>&1 | tee validation-results/actions-contract.log
      - name: Run reviewed-candidate audit and actual model artifact replay
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_semantic_admission.py -v 2>&1 | tee validation-results/admission.log
      - name: Run versioned sidecar and temporal projection tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_semantic_observations.py -v 2>&1 | tee validation-results/semantic-observations.log
      - name: Run aligned multilayer and affiliation regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_semantic_multilayer.py -v 2>&1 | tee validation-results/semantic-multilayer.log
      - name: Run layer-specific structure and group analysis
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_semantic_multilayer_structure.py -v 2>&1 | tee validation-results/semantic-multilayer-structure.log
      - name: Run affiliation partition boundary regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_affiliation_empty_projection.py -v 2>&1 | tee validation-results/affiliation-empty-projection.log
      - name: Run frozen longitudinal panel tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_semantic_panel.py -v 2>&1 | tee validation-results/semantic-panel.log
      - name: Run independent outcome and actual forecast regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_semantic_forecast.py -v 2>&1 | tee validation-results/semantic-forecast.log
      - name: Retain native validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-behavior-forecast-native-validation
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
